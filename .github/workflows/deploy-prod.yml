name: Paypadi Deploy — Prod

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        type: choice
        required: true
        default: all
        options: [all, android, ios]

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "any"
  JAVA_VERSION: "17"

jobs:
  # ─── Validation ─────────────────────────────────────────────────────────────
  validate:
    uses: ./.github/workflows/validate.yml
    secrets: inherit

  # ─── Android ────────────────────────────────────────────────────────────────
  android-prod:
    name: Android — Prod
    needs: validate
    runs-on: ubuntu-latest
    environment: prod
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          java-version: ${{ env.JAVA_VERSION }}
          setup-java: "true"
          setup-ruby: "true"

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode upload keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
            | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << 'EOF'
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build App Bundle — prod
        run: |
          flutter build appbundle \
            --flavor prod \
            --target lib/main_prod.dart \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --build-number=${{ github.run_number }} \
            --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: paypadi-prod-r${{ github.run_number }}.aab
          path: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          retention-days: 30

      - name: Deploy to Play Store — internal track
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: bundle exec fastlane android deploy_prod
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}

  # ─── iOS ────────────────────────────────────────────────────────────────────
  ios-prod:
    name: iOS — Prod
    needs: validate
    runs-on: macos-15
    environment: prod
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          setup-ruby: "true"

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Sync prod certificates via Match
        run: bundle exec fastlane ios sync_prod_certs
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

      - name: Build IPA — prod
        run: |
          flutter build ipa \
            --flavor prod \
            --target lib/main_prod.dart \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --build-number=${{ github.run_number }} \
            --release \
            --export-options-plist=ios/ExportOptionsProd.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: paypadi-prod-r${{ github.run_number }}.ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30

      - name: Upload to TestFlight
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: bundle exec fastlane ios deploy_prod
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

  # ─── Release ────────────────────────────────────────────────────────────────
  # Kept in this file intentionally: actions/download-artifact only has access
  # to artifacts from the current workflow run. Moving release to a separate
  # file would require cross-run artifact access, which needs the GitHub API.
  release:
    name: Create Release
    needs: [android-prod, ios-prod]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/**/*
          generate_release_notes: true
          prerelease: false