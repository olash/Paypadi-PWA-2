name: paypadi

description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_hooks: ^0.21.2
  hooks_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  auto_route: ^10.0.1
  flutter_svg: ^2.0.10+1
  pin_code_text_field: ^1.8.0
  icons_plus: ^5.0.0
  local_auth: ^3.0.0
  package_info_plus: ^9.0.0
  retrofit: ^4.4.2
  talker_dio_logger: ^5.0.0
  talker_flutter: ^5.0.0
  talker_riverpod_logger: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  freezed_annotation: ^3.0.0
  dio: ^5.8.0+1
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  share_plus: ^12.0.1
  screenshot: ^3.0.0
  flutter_to_pdf: ^0.4.1
  path_provider: ^2.1.5
  image_gallery_saver_plus: ^4.0.1
  toastification: ^3.0.3
  flutter_screenutil: ^5.9.3
  pretty_qr_code: ^3.5.0
  mobile_scanner: ^7.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.3
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  retrofit_generator: ^10.0.0
  auto_route_generator: ^10.0.1
  riverpod_generator: ^3.0.3
  flutter_gen_runner: ^5.10.0
  freezed: ^3.0.6
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/illustrations/
    - assets/colors.xml
    - assets/nigerian-banks.json

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/poppins/Poppins-Thin.ttf
          weight: 200
        - asset: fonts/poppins/Poppins-Light.ttf
          weight: 300
        - asset: fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/poppins/Poppins-Bold.ttf
          weight: 700

    - family: Manrope
      fonts:
        - asset: fonts/manrope/Manrope-Light.ttf
          weight: 300
        - asset: fonts/manrope/Manrope-Regular.ttf
          weight: 400
        - asset: fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: fonts/manrope/Manrope-Bold.ttf
          weight: 700

# flutter_gen_runner configuration
# Generates type-safe asset classes (AppAssets) and color constants (AppColors)
# from assets directory and colors.xml file. Run with: dart run build_runner build
flutter_gen:
  output: lib/config/gen/
  assets:
    outputs:
      class_name: AppAssets
      directory_path_enabled: true

  integrations:
    image: true
    flutter_svg: true

  colors:
    inputs:
      - assets/colors.xml
    outputs:
      class_name: AppColors
