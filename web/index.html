<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- SEO & PWA Meta -->
  <title>PayPadi — Pay Seamlessly</title>
  <meta name="description" content="Pay seamlessly with your digital wallet. No more change wahala with PayPadi.">
  <meta name="theme-color" content="#007D78">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="PayPadi">

  <!-- iOS Safari PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PayPadi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Open Graph -->
  <meta property="og:title" content="PayPadi — Pay Seamlessly">
  <meta property="og:description" content="Pay seamlessly with your digital wallet. No more change wahala.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">

  <style>
    /* =========================================================
       Loading Splash — shown while Flutter engine initialises.
       Mirrors the native splash: teal brand background + logo.
       ========================================================= */
    :root {
      --brand-primary: #007D78;
      --brand-accent:  #015B54;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--brand-primary);
      overflow: hidden;
    }

    #loading-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--brand-primary);
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loading-splash.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .splash-logo {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
      animation: pulse 1.8s ease-in-out infinite;
    }

    .splash-logo img {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }

    .splash-wordmark {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 48px;
    }

    .splash-dots {
      display: flex;
      gap: 8px;
    }

    .splash-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      animation: dotBounce 1.2s ease-in-out infinite;
    }

    .splash-dot:nth-child(2) { animation-delay: 0.2s; }
    .splash-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 100% { transform: scale(1);     opacity: 1; }
      50%       { transform: scale(1.06); opacity: 0.85; }
    }

    @keyframes dotBounce {
      0%, 100% { transform: translateY(0);   opacity: 0.4; }
      50%       { transform: translateY(-8px); opacity: 1; }
    }
  </style>
</head>

<body>
  <!-- ── Loading Splash ──────────────────────────────────────── -->
  <div id="loading-splash" aria-label="Loading PayPadi" role="status">
    <div class="splash-logo">
      <img src="icons/Icon-192.png" alt="PayPadi logo">
    </div>
    <span class="splash-wordmark">PayPadi</span>
    <div class="splash-dots" aria-hidden="true">
      <div class="splash-dot"></div>
      <div class="splash-dot"></div>
      <div class="splash-dot"></div>
    </div>
  </div>

  <!-- ── Flutter App Target ─────────────────────────────────── -->
  <script>
    // Remove the loading splash once Flutter renders its first frame.
    window.addEventListener('flutter-first-frame', function() {
      const splash = document.getElementById('loading-splash');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(() => splash.remove(), 450);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
