<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're offline — PayPadi</title>
  <meta name="theme-color" content="#007D78">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --brand-primary: #007D78;
      --brand-accent:  #015B54;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: #F9FAFB;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #414651;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }

    .icon-wrap {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      background: var(--brand-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
      box-shadow: 0 8px 32px rgba(0, 125, 120, 0.25);
    }

    .icon-wrap svg {
      width: 48px;
      height: 48px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #082431;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: #717680;
      max-width: 320px;
      margin-bottom: 40px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--brand-primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn:hover  { background: var(--brand-accent); }
    .btn:active { transform: scale(0.97); }

    .status-badge {
      margin-top: 48px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #A4A7AE;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #D5D7DA;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.4; }
      50%       { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="icon-wrap" aria-hidden="true">
      <!-- Wi-Fi off icon -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 1l22 22"/>
        <path d="M16.72 11.06A10.94 10.94 0 0119 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 015.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0122.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 014.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 016.95 0"/>
        <circle cx="12" cy="20" r="1" fill="white" stroke="none"/>
      </svg>
    </div>

    <h1>You're offline</h1>
    <p>
      PayPadi needs a network connection to keep your wallet balance live
      and process payments safely. Check your connection and try again.
    </p>

    <button class="btn" onclick="window.location.reload()">
      <!-- Refresh icon -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Try again
    </button>

    <div class="status-badge">
      <div class="dot"></div>
      Waiting for connection…
    </div>
  </div>

  <script>
    // Auto-reload when connection is restored.
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
